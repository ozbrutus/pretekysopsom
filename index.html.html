<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutyás Akadályverseny - Prekážkové preteky so psom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        img.poster {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            margin: 20px 0;
            padding: 15px 30px;
            background-color: #2d5a27;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1e3d1a;
        }
        .qr-section {
            margin-top: 15px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }
        .qr-code {
            width: 180px;
            height: 180px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Plakát képe (nevezd át a feltöltött plakátot poster.png-re) -->
    <img src="poster.png" alt="Kutyás Akadályverseny Plakát" class="poster">

    <!-- Jelentkezési gomb -->
    <div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdhjr-2SjqRdLbL9L6bMKNeB458ecrVvqyKW4YodRZMvpvqUA/viewform?usp=header" target="_blank" class="btn">
            Jelentkezés / Prihlásenie
        </a>
    </div>

    <!-- QR Kód szekció -->
    <div class="qr-section">
        <p><strong>Olvasd be a QR-kódot a jelentkezéshez:</strong></p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://docs.google.com/forms/d/e/1FAIpQLSdhjr-2SjqRdLbL9L6bMKNeB458ecrVvqyKW4YodRZMvpvqUA/viewform?usp=header" alt="Jelentkezési QR-kód" class="qr-code">
    </div>
</div>

</body>
</html>
